<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | IITH Fees Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a'},gold:{500:'#f59e0b'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],display:['Playfair Display','Georgia','serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-3">
      <a href="../index.html" class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-600 to-brand-800 flex items-center justify-center text-white font-bold text-sm">IITH</a>
      <div>
        <div class="font-display font-bold text-brand-800">Fees Portal</div>
        <div class="text-xs text-slate-500">Student Login</div>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md card p-8">
      <h1 class="font-display text-2xl font-bold text-brand-900 mb-1">Welcome back</h1>
      <p class="text-sm text-slate-500 mb-6">Sign in with your matriculation number and password.</p>

      <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100"></div>

      <form id="login-form" class="space-y-4" autocomplete="on">
        <div>
          <label for="matric" class="block text-sm font-medium mb-1">Matriculation Number</label>
          <input id="matric" name="matric" type="text" required class="input-field" placeholder="e.g. IITH/ND/2024/001" autocomplete="username" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input id="password" name="password" type="password" required minlength="6" class="input-field" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary w-full">Sign In</button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-100 text-sm text-slate-500">
        <p class="mb-2"><strong>Demo credentials:</strong></p>
        <p>Matric: <code class="bg-slate-100 px-1 rounded">IITH/ND/2024/001</code></p>
        <p>Password: <code class="bg-slate-100 px-1 rounded">demo1234</code></p>
        <p class="mt-3"><a href="activate.html" class="text-brand-700 font-medium hover:underline">Newly admitted student? Activate account →</a></p>
        <p class="mt-2"><a href="../index.html" class="text-slate-500 hover:underline">← Back to home</a></p>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
