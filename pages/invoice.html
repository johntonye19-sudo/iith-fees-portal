<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice | IITH Fees Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],display:['Playfair Display','Georgia','serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="../js/config.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-white border-b border-slate-200 no-print">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="pay.html" class="text-sm text-slate-500 hover:text-brand-700">← Change fee</a>
      <span class="font-display font-bold text-brand-800">Invoice</span>
      <span class="w-16"></span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <div class="card p-6 sm:p-8">
      <div class="flex items-start justify-between mb-6">
        <div>
          <div class="font-display font-bold text-brand-800 text-lg">IITH Yenagoa</div>
          <div class="text-xs text-slate-500">Fees &amp; Levies Payment Portal</div>
        </div>
        <div class="text-right text-sm">
          <div class="font-semibold">E-TELLER / INVOICE</div>
          <div class="text-slate-500" id="inv-ref">—</div>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4 text-sm mb-6">
        <div><span class="text-slate-500">Student</span><div class="font-medium" id="inv-name">—</div></div>
        <div><span class="text-slate-500">Matric No.</span><div class="font-medium" id="inv-matric">—</div></div>
        <div><span class="text-slate-500">Programme</span><div class="font-medium" id="inv-programme">—</div></div>
        <div><span class="text-slate-500">Level</span><div class="font-medium" id="inv-level">—</div></div>
      </div>

      <div class="border-t border-b border-slate-100 py-4 space-y-2 text-sm">
        <div class="flex justify-between"><span id="inv-label">Fee</span><span id="inv-amount">—</span></div>
        <div class="flex justify-between text-slate-500"><span>System charge</span><span id="inv-charge">—</span></div>
        <div class="flex justify-between font-semibold text-base pt-2"><span>Total payable</span><span class="text-brand-700" id="inv-total">—</span></div>
      </div>

      <p class="text-xs text-slate-500 mt-4">Generated: <span id="inv-date">—</span></p>
      <p class="text-xs text-slate-500 mt-1">Status: <span class="badge badge-warning">PENDING</span></p>

      <div class="mt-6 no-print space-y-3">
        <p id="pay-note" class="hidden text-sm text-amber-700 mb-2"></p>
        <button id="pay-now-btn" type="button" class="btn-primary w-full">Pay with Paystack</button>
        <p class="text-xs text-center text-slate-500">In production: Paystack / Flutterwave / bank transfer with this reference.</p>
        <button type="button" onclick="window.print()" class="w-full py-2 text-sm text-brand-700 border border-brand-200 rounded-xl hover:bg-brand-50">Print invoice</button>
      </div>
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
